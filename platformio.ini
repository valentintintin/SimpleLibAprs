; PlatformIO project configuration for SimpleLibAprs.
;
; Run the test suite on the host machine:
;     pio test -e native
;
; The `arduino_*` environments are provided as build/compile targets for the
; library and its examples on real hardware.

[platformio]
default_envs = native

; ---------------------------------------------------------------------------
; Native (host) environment — used by `pio test`.
; NATIVE makes the PROGMEM helpers fall back to the standard C library.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = custom
test_build_src = yes
build_flags = -std=c++17 -DNATIVE -I src

; ---------------------------------------------------------------------------
; Example hardware targets (compile-check the library on MCUs).
; ---------------------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno
framework = arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
